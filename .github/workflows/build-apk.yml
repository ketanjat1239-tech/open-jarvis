name: KAI Android APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Android project files found."

      - name: Check Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from repository root."
            echo "A valid Gradle wrapper must be added before building."
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Build-Failure-Logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
