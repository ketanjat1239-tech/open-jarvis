name: Jarvis Android
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Jarvis
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          CODE=$?
          {
            echo "## Build exit code: $CODE"
            echo "### What went wrong"
            echo '```'
            grep -A15 "What went wrong" build.log | head -40
            echo '```'
            echo "### Errors"
            echo '```'
            grep -E "error:|^e: " build.log | head -30
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          tail -40 build.log
          exit $CODE
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: '**/build/outputs/apk/debug/*.apk'
