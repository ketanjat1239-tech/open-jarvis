name: Android Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || touch failed.flag
          echo "===== WHAT WENT WRONG ====="
          grep -A15 "What went wrong" build.log || true
          echo "===== ERRORS ====="
          grep -E "error:|e: " build.log | head -30 || true
          echo "===== LAST 40 LINES ====="
          tail -40 build.log
          test ! -f failed.flag
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: '**/build/outputs/apk/debug/*.apk'
