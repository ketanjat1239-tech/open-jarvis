name: Jarvis Fix Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Jarvis
        run: |
          sed -i "s/kotlinCompilerExtensionVersion '1.5.5'/kotlinCompilerExtensionVersion '1.5.4'/" app/build.gradle
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          CODE=$?
          {
            echo "## Build exit code: $CODE"
            echo '```'
            grep -A15 "What went wrong" build.log | head -40
            grep -E "^e: " build.log | head -20
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: '**/build/outputs/apk/debug/*.apk'
